<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maker's Secret Satan</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #000;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-weight: 800;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    header {
      padding: clamp(14px, 2.5vw, 32px);
      padding-left: max(clamp(14px, 2.5vw, 32px), env(safe-area-inset-left));
      padding-top: max(clamp(14px, 2.5vw, 32px), env(safe-area-inset-top));
    }

    .logo {
      display: block;
      width: clamp(140px, 18vw, 280px);
      height: auto;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(16px, 4vw, 48px) 6vh;
    }

    .video {
      width: min(100%, 1280px, calc((100dvh - 200px) * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" aria-label="Maker's Secret Satan home">
      <img class="logo" src="/logo.svg" alt="Maker's Secret Satan">
    </a>
  </header>

  <main>
    <div class="video">
      <iframe
        src="https://www.youtube-nocookie.com/embed/3QVJE21S-sU?rel=0"
        title="Secret video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>
  </main>
</body>
</html>
